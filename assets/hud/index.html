<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Yunay AI Assistant v2.0.0</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "primary": "#c3f5ff",
        "primary-container": "#00e5ff",
        "on-primary-container": "#00363d",
        "primary-fixed-dim": "#00daf3",
        "secondary": "#74d1ff",
        "secondary-container": "#00a4d8",
        "on-secondary-container": "#003548",
        "on-secondary-fixed-variant": "#004d67",
        "tertiary": "#e8ecff",
        "error": "#ffb4ab",
        "error-container": "#93000a",
        "surface": "#0d1013",
        "surface-dim": "#0a0c0f",
        "surface-bright": "#37393d",
        "surface-container-lowest": "#08090b",
        "surface-container-low": "#15181b",
        "surface-container": "#191c1f",
        "surface-container-high": "#202427",
        "surface-container-highest": "#2a2e32",
        "on-surface": "#e6e8eb",
        "on-surface-variant": "#a7b3b6",
        "outline": "#5c6a6d",
        "outline-variant": "#2e3538"
      },
      borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", "2xl": "1rem", full: "9999px" },
      spacing: {
        "gutter": "1.25rem",
        "space-xs": "0.375rem",
        "space-sm": "0.625rem",
        "space-md": "1rem",
        "space-lg": "1.5rem",
        "space-xl": "2rem",
        "margin": "1.25rem"
      },
      fontFamily: {
        display: ["Space Grotesk", "sans-serif"],
        body: ["Inter", "sans-serif"]
      }
    }
  }
};
</script>
<style>
  :root {
    --primary: #c3f5ff;
    --primary-container: #00e5ff;
    --on-primary-container: #00363d;
    --secondary: #74d1ff;
    --surface: #0d1013;
    --surface-high: #202427;
    --surface-lowest: #08090b;
    --on-surface: #e6e8eb;
    --on-surface-variant: #a7b3b6;
    --outline-variant: #2e3538;
    --error: #ffb4ab;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    background-color: #0d1013;
    color: #e6e8eb;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  body { overscroll-behavior-y: none; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  ::-webkit-scrollbar { display: none; }

  .tabular { font-variant-numeric: tabular-nums; }
  button:focus-visible, a:focus-visible { outline: 2px solid #00e5ff; outline-offset: 2px; }

  /* ---- Header entrance ---- */
  @keyframes headerDrop { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  #app-header { animation: headerDrop 0.55s cubic-bezier(0.16,1,0.3,1) both; }

  @keyframes brandFade { from { opacity: 0; letter-spacing: 0.08em; } to { opacity: 1; letter-spacing: normal; } }
  #brand-name { animation: brandFade 0.7s ease-out 0.25s both; }

  /* ---- Status ticker swap ---- */
  #status-text { display: inline-block; transition: opacity 0.25s ease, transform 0.25s ease; }
  #status-text.swap { opacity: 0; transform: translateY(4px); }

  /* ---- Core mark state ring ---- */
  #core-ring-active { transition: stroke 0.4s ease, filter 0.4s ease; }

  /* ---- Orb state machine ---- */
  #orb-core { transition: box-shadow 0.09s linear, transform 0.15s ease; }
  #orb-glow, #orb-inner, #orb-icon, #orb-ring-outer, #orb-ring-mid {
    transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.09s linear, stroke 0.4s ease;
  }

  @keyframes idleBreathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.035); } }
  @keyframes listenBounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  @keyframes thinkPulse { 0%,100% { transform: scale(1); filter: drop-shadow(0 0 10px #c084fc); } 50% { transform: scale(1.06); filter: drop-shadow(0 0 24px #a855f7); } }
  @keyframes speakPulse { 0%,100% { transform: scale(1); } 25% { transform: scale(1.06); } 50% { transform: scale(0.97); } 75% { transform: scale(1.09); } }

  .hud[data-state="idle"] #orb-core { animation: idleBreathe 3.2s ease-in-out infinite; }
  .hud[data-state="listening"] #orb-core { animation: none; }
  .hud[data-state="thinking"] #orb-core { animation: thinkPulse 1.2s ease-in-out infinite; }
  .hud[data-state="speaking"] #orb-core { animation: none; }

  .hud[data-state="listening"] #status-dot { background: #00e5ff; box-shadow: 0 0 8px #00e5ff; }
  .hud[data-state="thinking"] #status-dot { background: #c084fc; box-shadow: 0 0 8px #c084fc; }
  .hud[data-state="speaking"] #status-dot { background: #74d1ff; box-shadow: 0 0 8px #74d1ff; }

  /* ---- Arc reactor reacts to Jarvis / user talking ---- */
  #arc-glow, #arc-ring-outer, #arc-ring-mid { transition: background 0.4s ease, opacity 0.4s ease, stroke 0.4s ease, filter 0.4s ease; }

  .hud[data-state="listening"] #arc-glow { background: rgba(0,229,255,0.4); }
  .hud[data-state="listening"] #arc-ring-outer { stroke: #00e5ff; opacity: 0.85; filter: drop-shadow(0 0 4px #00e5ff); }
  .hud[data-state="listening"] #arc-ring-mid { opacity: 0.75; filter: drop-shadow(0 0 4px #00e5ff); }

  .hud[data-state="thinking"] #arc-glow { background: rgba(192,132,252,0.4); }
  .hud[data-state="thinking"] #arc-ring-outer { stroke: #c084fc; opacity: 0.85; filter: drop-shadow(0 0 5px #c084fc); }
  .hud[data-state="thinking"] #arc-ring-mid { stroke: #c084fc; opacity: 0.75; filter: drop-shadow(0 0 5px #c084fc); }

  .hud[data-state="speaking"] #arc-glow { background: rgba(116,209,255,0.4); }
  .hud[data-state="speaking"] #arc-ring-outer { stroke: #74d1ff; opacity: 0.85; filter: drop-shadow(0 0 4px #74d1ff); }
  .hud[data-state="speaking"] #arc-ring-mid { stroke: #74d1ff; opacity: 0.75; filter: drop-shadow(0 0 4px #74d1ff); }

  /* One-shot flash the instant state activates */
  @keyframes arcMoment {
    0%   { transform: scale(1); filter: brightness(1); }
    35%  { transform: scale(1.12); filter: brightness(1.8); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  #arc-reactor.arc-moment { animation: arcMoment 0.7s cubic-bezier(0.16,1,0.3,1) both; }

  /* ---- Chat panel ---- */
  #chat-log::-webkit-scrollbar { display: none; }
  @keyframes bubbleIn { from { opacity: 0; transform: translateY(6px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .chat-bubble { animation: bubbleIn 0.3s cubic-bezier(0.16,1,0.3,1) both; }

  @keyframes typingDot { 0%,80%,100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }
  .typing-dot { animation: typingDot 1.1s ease-in-out infinite; }

  /* Full offline layout fallbacks in case Tailwind CDN is delayed/offline */
  .hud-container {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .hud-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-top: 76px;
    padding-bottom: 96px;
    position: relative;
    z-index: 10;
  }
</style>
</head>
<body class="hud bg-surface font-body text-on-surface min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container" data-state="idle">

<div class="hud-container">

<!-- ============ FULL-VIEWPORT BACKGROUND ============ -->
<div class="fixed inset-0 w-full h-full pointer-events-none z-0 overflow-hidden">
  <canvas id="shader-canvas" style="display:block;width:100%;height:100%"></canvas>
  <div class="absolute inset-0 pointer-events-none opacity-10 bg-[radial-gradient(#00e5ff_1px,transparent_1px)] [background-size:28px_28px]"></div>
</div>

<!-- ============ HEADER ============ -->
<header id="app-header" class="fixed top-0 w-full z-50 pt-safe bg-surface-container-lowest" style="background-color:#08090b;">
  <div class="relative max-w-md mx-auto border-b border-outline-variant/50" style="border-color:rgba(46,53,56,0.5);">

    <!-- HUD corner ticks -->
    <div class="absolute left-0 top-0 w-3 h-3 border-l border-t border-primary-container/40 pointer-events-none" style="border-color:rgba(0,229,255,0.4);"></div>
    <div class="absolute right-0 top-0 w-3 h-3 border-r border-t border-primary-container/40 pointer-events-none" style="border-color:rgba(0,229,255,0.4);"></div>

    <div class="h-[76px] px-gutter flex items-center gap-3 px-5">

      <!-- Core mark: radial charge ring housing a hex plate -->
      <div class="relative w-11 h-11 shrink-0 flex items-center justify-center cursor-pointer" id="core-mark-btn">
        <svg class="absolute inset-0 -rotate-90" viewBox="0 0 44 44">
          <circle cx="22" cy="22" fill="none" r="19" stroke="#2e3538" stroke-width="2.5"></circle>
          <circle id="core-ring-active" cx="22" cy="22" fill="none" r="19" stroke="#00e5ff" stroke-dasharray="117 120" stroke-linecap="round" stroke-width="2.5" style="filter:drop-shadow(0 0 3px #00e5ff88)"></circle>
        </svg>
        <div class="w-7 h-7 bg-surface-container-high flex items-center justify-center" style="background-color:#202427; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0% 50%);">
          <svg class="w-4 h-4 text-primary-container" id="core-mark-icon" viewBox="0 0 24 24" fill="currentColor" style="color:#00e5ff;">
            <circle cx="12" cy="12" r="2.5"></circle>
            <circle cx="12" cy="4" r="1.5"></circle>
            <circle cx="12" cy="20" r="1.5"></circle>
            <circle cx="4" cy="12" r="1.5"></circle>
            <circle cx="20" cy="12" r="1.5"></circle>
            <circle cx="6.34" cy="6.34" r="1.5"></circle>
            <circle cx="17.66" cy="17.66" r="1.5"></circle>
            <circle cx="6.34" cy="17.66" r="1.5"></circle>
            <circle cx="17.66" cy="6.34" r="1.5"></circle>
          </svg>
        </div>
      </div>

      <!-- Identity + live status ticker -->
      <div class="flex flex-col justify-center min-w-0 gap-0.5 flex-1">
        <div class="flex items-center gap-1.5">
          <span id="brand-name" class="font-display text-[16px] font-semibold tracking-tight text-on-surface truncate" style="font-family:'Space Grotesk',sans-serif; letter-spacing: 0.05em;">Yunay AI Assistant</span>
          <span class="text-[10px] px-1.5 py-0.2 rounded bg-primary-container/15 border border-primary-container/40 text-primary-container font-mono font-semibold tracking-wider" style="color:#00e5ff; border-color:rgba(0,229,255,0.4);">v2.0.0</span>
        </div>
        <span class="flex items-center gap-1.5 text-[11px] text-on-surface-variant truncate" style="color:#a7b3b6;">
          <span class="relative flex w-1.5 h-1.5 shrink-0">
            <span id="status-dot-ping" class="absolute inline-flex w-full h-full rounded-full bg-primary-container opacity-60 animate-ping" style="background-color:#00e5ff;"></span>
            <span id="status-dot" class="relative inline-flex rounded-full w-1.5 h-1.5 bg-primary-container" style="background-color:#00e5ff;"></span>
          </span>
          <span id="status-text">Calm — monitoring systems</span>
        </span>
      </div>

      <!-- Telemetry cluster: time, uplink, controls -->
      <div class="flex items-center gap-3 pl-3 shrink-0 border-l border-outline-variant/40" style="border-left-color:rgba(46,53,56,0.4);">
        <div class="flex flex-col items-end gap-1 leading-none">
          <span class="font-display text-[15px] font-semibold text-on-surface tabular" id="hud-clock" style="font-family:'Space Grotesk',sans-serif;">10:42</span>
          <span class="flex items-end gap-0.5 h-2" id="uplink-bars" title="Uplink stable">
            <span class="w-0.5 h-[40%] rounded-full bg-secondary uplink-bar" style="background-color:#74d1ff;"></span>
            <span class="w-0.5 h-[65%] rounded-full bg-secondary uplink-bar" style="background-color:#74d1ff;"></span>
            <span class="w-0.5 h-[85%] rounded-full bg-primary-container uplink-bar" style="background-color:#00e5ff;"></span>
            <span class="w-0.5 h-full rounded-full bg-primary-container uplink-bar" style="background-color:#00e5ff;"></span>
          </span>
        </div>

        <button aria-label="Diagnostic controls" id="settings-trigger-btn" class="relative w-10 h-10 flex items-center justify-center text-primary hover:text-primary-container active:scale-95 transition-all">
          <span class="absolute inset-0 bg-surface-container-high" style="background-color:#202427; clip-path: polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0% 50%);"></span>
          <svg class="w-5 h-5 relative z-10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#00e5ff;">
            <line x1="4" y1="21" x2="4" y2="14"></line>
            <line x1="4" y1="10" x2="4" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12" y2="3"></line>
            <line x1="20" y1="21" x2="20" y2="16"></line>
            <line x1="20" y1="12" x2="20" y2="3"></line>
            <line x1="1" y1="14" x2="7" y2="14"></line>
            <line x1="9" y1="8" x2="15" y2="8"></line>
            <line x1="17" y1="16" x2="23" y2="16"></line>
          </svg>
        </button>
      </div>

    </div>
  </div>
</header>

<!-- ============ MAIN SCROLLABLE CONTENT ============ -->
<main class="hud-main">
  <div class="flex flex-col w-full relative">

    <div class="relative z-10 flex flex-col items-center px-4 pt-4 pb-4 w-full max-w-md mx-auto">

      <!-- Arc reactor -->
      <div class="relative w-64 h-64 flex items-center justify-center mb-4 mt-2" id="arc-reactor">
        <div class="absolute inset-4 rounded-full bg-primary-container/10 filter blur-3xl pointer-events-none animate-pulse" id="arc-glow" style="background:rgba(0,229,255,0.15);"></div>

        <svg class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 256 256">
          <circle class="origin-center animate-[spin_40s_linear_infinite]" id="arc-ring-outer" cx="128" cy="128" fill="none" opacity="0.35" r="122" stroke="#74d1ff" stroke-dasharray="3 8" stroke-width="1"></circle>
          <circle class="origin-center animate-[spin_24s_linear_infinite_reverse]" id="arc-ring-mid" cx="128" cy="128" fill="none" opacity="0.45" r="116" stroke="#00e5ff" stroke-dasharray="28 12 7 12" stroke-width="1.5"></circle>
          <line stroke="#00e5ff" stroke-width="2" x1="128" x2="128" y1="4" y2="12"></line>
          <line stroke="#00e5ff" stroke-width="2" x1="128" x2="128" y1="244" y2="252"></line>
          <line stroke="#00e5ff" stroke-width="2" x1="4" x2="12" y1="128" y2="128"></line>
          <line stroke="#00e5ff" stroke-width="2" x1="244" x2="252" y1="128" y2="128"></line>
          <g class="origin-center animate-[spin_60s_linear_infinite]" opacity="0.85">
            <rect class="animate-pulse" fill="#00e5ff" height="11" rx="2" width="4" x="126" y="16"></rect>
            <rect fill="#74d1ff" height="15" rx="1.5" width="3" x="169" y="29"></rect>
            <rect fill="#00e5ff" height="9" rx="2" width="4" x="205" y="61"></rect>
            <rect class="animate-pulse" fill="#00e5ff" height="13" rx="1.5" width="3" x="227" y="103"></rect>
            <rect fill="#74d1ff" height="18" rx="2" width="4" x="227" y="148"></rect>
            <rect fill="#00e5ff" height="11" rx="1.5" width="3" x="205" y="188"></rect>
            <rect class="animate-pulse" fill="#00e5ff" height="16" rx="2" width="4" x="169" y="219"></rect>
            <rect fill="#74d1ff" height="13" rx="1.5" width="3" x="126" y="230"></rect>
            <rect fill="#00e5ff" height="9" rx="2" width="4" x="83" y="219"></rect>
            <rect class="animate-pulse" fill="#74d1ff" height="14" rx="1.5" width="3" x="48" y="188"></rect>
            <rect fill="#00e5ff" height="11" rx="2" width="4" x="26" y="148"></rect>
            <rect fill="#00e5ff" height="20" rx="1.5" width="3" x="26" y="103"></rect>
            <rect class="animate-pulse" fill="#74d1ff" height="13" rx="2" width="4" x="48" y="61"></rect>
            <rect fill="#00e5ff" height="9" rx="1.5" width="3" x="83" y="29"></rect>
          </g>
        </svg>

        <div class="absolute w-[184px] h-[184px] rounded-full bg-surface-container-high/40 backdrop-blur-sm shadow-[inset_0_0_24px_rgba(0,229,255,0.22)] flex items-center justify-center animate-[spin_18s_linear_infinite]" style="border: 1px solid rgba(0,229,255,0.15);">
          <div class="absolute inset-1 rounded-full border border-primary-container/30 border-t-transparent border-b-transparent" style="border-color:rgba(0,229,255,0.3) transparent;"></div>
          <div class="absolute inset-4 rounded-full border border-secondary/40 border-r-transparent" style="border-color:rgba(116,209,255,0.4) transparent rgba(116,209,255,0.4) rgba(116,209,255,0.4);"></div>
        </div>

        <div class="absolute w-[140px] h-[140px] rounded-full bg-surface-container-lowest/80 backdrop-blur-md shadow-[0_0_25px_rgba(0,229,255,0.18)] flex items-center justify-center animate-[spin_10s_linear_infinite_reverse]">
          <div class="absolute w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_8px_#00e5ff] top-1" style="background:#00e5ff;"></div>
          <div class="absolute w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_8px_#00e5ff] bottom-1" style="background:#00e5ff;"></div>
          <div class="absolute w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_8px_#00e5ff] left-1" style="background:#00e5ff;"></div>
          <div class="absolute w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_8px_#00e5ff] right-1" style="background:#00e5ff;"></div>

<script>
(function() {
  const isAndroid = typeof window.JarvisBridge !== 'undefined';

  // ---- WebGL shader background ----
  const canvas = document.getElementById('shader-canvas');
  function syncSize() {
    if (!canvas) return;
    const w = canvas.clientWidth || window.innerWidth || 1280;
    const h = canvas.clientHeight || window.innerHeight || 720;
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  }
  if (typeof ResizeObserver !== 'undefined' && canvas) new ResizeObserver(syncSize).observe(canvas);
  syncSize();

  const gl = canvas ? (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')) : null;
  if (gl) {
    const vs = `attribute vec2 a_position;varying vec2 v_texCoord;void main(){v_texCoord=a_position*0.5+0.5;gl_Position=vec4(a_position,0.0,1.0);}`;
    const fs = `precision highp float;
uniform float u_time;uniform vec2 u_resolution;
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}
vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}
float snoise(vec2 v){
  const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);
  vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);
  vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod289(i);
  vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));
  vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);
  m=m*m;m=m*m;
  vec3 x=2.0*fract(p*C.www)-1.0;vec3 h=abs(x)-0.5;vec3 ox=floor(x+0.5);vec3 a0=x-ox;
  m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);
  vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.0*dot(m,g);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-0.5*u_resolution.xy)/min(u_resolution.x,u_resolution.y);
  vec3 col=vec3(0.015,0.02,0.03);
  vec2 grid=fract(gl_FragCoord.xy/32.0);
  float gridLine=(step(0.97,grid.x)+step(0.97,grid.y))*0.03;
  col+=vec3(0.0,0.9,1.0)*gridLine;
  float dist=length(uv);
  float pulse=0.5+0.5*sin(u_time*1.8);
  float glow=exp(-dist*2.8)*(0.3+0.12*pulse);
  vec3 neonCyan=vec3(0.0,0.898,1.0);vec3 electricBlue=vec3(0.298,0.788,1.0);
  col+=mix(neonCyan,electricBlue,sin(u_time*0.5)*0.5+0.5)*glow;
  float n=snoise(uv*3.0+vec2(0.0,-u_time*0.2));
  col+=neonCyan*smoothstep(0.45,0.8,n)*0.06;
  gl_FragColor=vec4(col,1.0);
}`;
    function cs(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; }
    const prog = gl.createProgram();
    gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    const pos = gl.getAttribLocation(prog, 'a_position');
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
    const uTime = gl.getUniformLocation(prog, 'u_time');
    const uRes = gl.getUniformLocation(prog, 'u_resolution');
    let lastRenderTime = 0;
    function render(t) {
      if (document.hidden) {
        setTimeout(() => requestAnimationFrame(render), 500);
        return;
      }
      const isIdle = (document.body && document.body.dataset && document.body.dataset.state === 'idle');
      const minInterval = isIdle ? 45 : 16;
      if (t - lastRenderTime >= minInterval) {
        lastRenderTime = t;
        if (typeof ResizeObserver === 'undefined') syncSize();
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (uTime) gl.uniform1f(uTime, t * 0.001);
        if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      }
      requestAnimationFrame(render);
    }
    render(0);
  }

  // ---- Assistant state machine ----
  const hud = document.body;
  const orbCore = document.getElementById('orb-core');
  const orbInner = document.getElementById('orb-inner');
  const orbIcon = document.getElementById('orb-icon');
  const micBtn = document.getElementById('mic-trigger-btn');
  const micIcon = document.getElementById('mic-icon');
  const statusText = document.getElementById('status-text');
  const coreRing = document.getElementById('core-ring-active');
  const micNote = document.getElementById('mic-permission-note');
  const chatLog = document.getElementById('chat-log');
  const arcReactor = document.getElementById('arc-reactor');
  const arcCoils = document.querySelectorAll('#arc-reactor svg g rect');
  const arcRingOuter = document.getElementById('arc-ring-outer');
  const arcRingMid = document.getElementById('arc-ring-mid');
  const arcGlow = document.getElementById('arc-glow');
  const hudClock = document.getElementById('hud-clock');
  const settingsBtn = document.getElementById('settings-trigger-btn');
  const historyBtn = document.getElementById('history-btn');
  const powerBtn = document.getElementById('power-toggle-btn');
  const powerIcon = document.getElementById('power-icon');
  const powerText = document.getElementById('power-status-text');
  const screenShareBtn = document.getElementById('screen-share-btn');

  const IDLE_COPY = ["Calm — monitoring systems", "Standing by, all systems nominal"];
  let idleTickerIndex = 0, idleTickerTimer = null;

  function setStatusText(text) {
    if (!statusText) return;
    statusText.classList.add('swap');
    setTimeout(() => { statusText.textContent = text; statusText.classList.remove('swap'); }, 220);
  }
  function startIdleTicker() {
    stopIdleTicker();
    idleTickerIndex = 0;
    setStatusText(IDLE_COPY[0]);
    idleTickerTimer = setInterval(() => {
      idleTickerIndex = (idleTickerIndex + 1) % IDLE_COPY.length;
      setStatusText(IDLE_COPY[idleTickerIndex]);
    }, 5500);
  }
  function stopIdleTicker() { if (idleTickerTimer) { clearInterval(idleTickerTimer); idleTickerTimer = null; } }

  const GLOW_RGB = { listening: '0,229,255', thinking: '192,132,252', speaking: '116,209,255', idle: '0,229,255' };
  function setOrbGlow(level, key) {
    if (!orbCore) return;
    const l = Math.max(0, Math.min(1, level));
    const rgb = GLOW_RGB[key] || GLOW_RGB.listening;
    const blur = 28 + l * 55;
    const spread = l * 16;
    const outerAlpha = (0.35 + l * 0.5).toFixed(2);
    orbCore.style.boxShadow = `0 0 ${blur}px ${spread}px rgba(${rgb},${outerAlpha})`;
    if (orbInner) {
      const innerAlpha = (0.65 + l * 0.35).toFixed(2);
      orbInner.style.boxShadow = `0 0 ${14 + l * 34}px rgba(${rgb},${innerAlpha})`;
    }
  }
  function clearOrbGlow() {
    if (orbCore) orbCore.style.boxShadow = '';
    if (orbInner) orbInner.style.boxShadow = '';
  }

  function triggerArcMoment() {
    if (!arcReactor) return;
    arcReactor.classList.remove('arc-moment');
    void arcReactor.offsetWidth;
    arcReactor.classList.add('arc-moment');
    setTimeout(() => arcReactor.classList.remove('arc-moment'), 700);
  }

  const SVG_BLUR_SM = '<svg class="w-[13px] h-[13px]" viewBox="0 0 24 24" fill="currentColor" style="color:#00e5ff;"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="4" r="1.5"/><circle cx="12" cy="20" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="20" cy="12" r="1.5"/><circle cx="6.34" cy="6.34" r="1.5"/><circle cx="17.66" cy="17.66" r="1.5"/><circle cx="6.34" cy="17.66" r="1.5"/><circle cx="17.66" cy="6.34" r="1.5"/></svg>';
  const SVG_PERSON_SM = '<svg class="w-[13px] h-[13px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color:#c3f5ff;"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
  const SVG_ORB_IDLE = '<svg class="w-[26px] h-[26px]" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="4" r="1.5"/><circle cx="12" cy="20" r="1.5"/><circle cx="4" cy="12" r="1.5"/><circle cx="20" cy="12" r="1.5"/><circle cx="6.34" cy="6.34" r="1.5"/><circle cx="17.66" cy="17.66" r="1.5"/><circle cx="6.34" cy="17.66" r="1.5"/><circle cx="17.66" cy="6.34" r="1.5"/></svg>';
  const SVG_ORB_ACTIVE = '<svg class="w-[26px] h-[26px]" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="9" width="2" height="6" rx="1"/><rect x="6" y="5" width="2" height="14" rx="1"/><rect x="10" y="2" width="2" height="20" rx="1"/><rect x="14" y="6" width="2" height="12" rx="1"/><rect x="18" y="4" width="2" height="16" rx="1"/><rect x="22" y="9" width="2" height="6" rx="1"/></svg>';
  const SVG_MIC_ON = '<svg class="w-[26px] h-[26px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
  const SVG_MIC_OFF = '<svg class="w-[26px] h-[26px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="2" y1="2" x2="22" y2="22"></line><path d="M18.89 13.23A7.12 7.12 0 0 0 19 12v-2"></path><path d="M5 10v2a7 7 0 0 0 10.79 5.88"></path><path d="M15 9.34V5a3 3 0 0 0-5.68-1.33"></path><path d="M9 9v3a3 3 0 0 0 3.32 2.99"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';

  function setState(state) {
    const prevState = hud.dataset.state;
    const s = (state || 'idle').toLowerCase();
    hud.dataset.state = s;

    if (coreRing) {
      if (s === 'speaking') coreRing.setAttribute('stroke', '#74d1ff');
      else if (s === 'thinking') coreRing.setAttribute('stroke', '#c084fc');
      else coreRing.setAttribute('stroke', '#00e5ff');
    }
    if (orbIcon) {
      orbIcon.innerHTML = (s === 'idle') ? SVG_ORB_IDLE : SVG_ORB_ACTIVE;
    }
    if (micIcon) {
      micIcon.style.color = (s === 'listening') ? '#ffb4ab' : '#00363d';
    }

    if (s === 'idle') {
      startIdleTicker();
      clearOrbGlow();
      if (orbCore) orbCore.style.transform = '';
      removeTypingIndicator();
    } else if (s === 'listening') {
      stopIdleTicker();
      setStatusText('Listening…');
      removeTypingIndicator();
    } else if (s === 'thinking') {
      stopIdleTicker();
      setStatusText('Processing query…');
      showTypingIndicator();
    } else if (s === 'speaking') {
      stopIdleTicker();
      setStatusText('Responding…');
      removeTypingIndicator();
    }

    if (s === 'idle' || s === 'thinking') {
      if (arcCoils) {
        arcCoils.forEach(rect => {
          rect.style.transform = '';
          rect.style.opacity = '';
        });
      }
      if (arcRingOuter) {
        arcRingOuter.style.strokeWidth = '';
        arcRingOuter.style.opacity = '';
      }
      if (arcRingMid) {
        arcRingMid.style.strokeWidth = '';
        arcRingMid.style.opacity = '';
      }
      if (arcGlow) {
        arcGlow.style.opacity = '';
        arcGlow.style.transform = '';
      }
    }

    if ((s === 'listening' || s === 'speaking' || s === 'thinking') && s !== prevState) {
      triggerArcMoment();
    }
  }

  // ---- Chat log rendering ----
  function timeNow() {
    return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }

  function addMessage(who, text, timeStr) {
    if (!chatLog) return;
    const isUser = (who === 'you' || who === 'user');
    const row = document.createElement('div');
    row.className = 'chat-row flex items-start gap-2 max-w-[92%] ' + (isUser ? 'self-end flex-row-reverse ml-auto' : 'self-start');

    const avatar = document.createElement('div');
    avatar.className = 'shrink-0 w-6 h-6 rounded-full backdrop-blur-sm border flex items-center justify-center mt-3 ' +
      (isUser ? 'bg-primary-container/20 border-primary-container/40' : 'bg-surface-container-high/70 border-primary-container/25');
    avatar.style.backgroundColor = isUser ? 'rgba(0,229,255,0.2)' : '#202427';
    avatar.style.borderColor = isUser ? 'rgba(0,229,255,0.4)' : 'rgba(0,229,255,0.25)';
    avatar.innerHTML = isUser ? SVG_PERSON_SM : SVG_BLUR_SM;

    const col = document.createElement('div');
    col.className = 'flex flex-col gap-1 min-w-0 ' + (isUser ? 'items-end' : 'items-start');

    const meta = document.createElement('span');
    meta.className = 'flex items-center gap-1.5 text-[10px] px-1';
    meta.style.color = 'rgba(167,179,182,0.7)';
    meta.innerHTML = (isUser ? 'You' : 'Jarvis') + ' <span style="opacity:0.5">·</span> ' + (timeStr || timeNow());

    const bubble = document.createElement('div');
    bubble.className = 'chat-bubble px-3 py-2 text-[13px] leading-snug rounded-xl backdrop-blur-sm';
    if (isUser) {
      bubble.style.backgroundColor = 'rgba(0,229,255,0.15)';
      bubble.style.border = '1px solid rgba(0,229,255,0.35)';
      bubble.style.borderTopRightRadius = '2px';
      bubble.style.color = '#e6e8eb';
    } else {
      bubble.style.backgroundColor = 'rgba(32,36,39,0.7)';
      bubble.style.border = '1px solid rgba(46,53,56,0.6)';
      bubble.style.borderTopLeftRadius = '2px';
      bubble.style.color = '#e6e8eb';
    }
    bubble.textContent = text;

    col.appendChild(meta);
    col.appendChild(bubble);
    row.appendChild(avatar);
    row.appendChild(col);
    chatLog.appendChild(row);

    requestAnimationFrame(() => {
      chatLog.scrollTop = chatLog.scrollHeight;
    });
  }

  let activeTypingRow = null;
  function showTypingIndicator() {
    if (activeTypingRow || !chatLog) return;
    const row = document.createElement('div');
    row.className = 'chat-row flex items-start gap-2 self-start max-w-[92%]';
    row.innerHTML =
      '<div class="shrink-0 w-6 h-6 rounded-full backdrop-blur-sm border flex items-center justify-center mt-3" style="background:#202427; border-color:rgba(0,229,255,0.25);">' +
        SVG_BLUR_SM +
      '</div>' +
      '<div class="flex flex-col gap-1">' +
        '<span class="text-[10px] px-1" style="color:rgba(167,179,182,0.7);">Jarvis</span>' +
        '<div class="chat-bubble flex items-center gap-1 rounded-xl rounded-tl-sm px-3 py-2" style="background:rgba(32,36,39,0.7); border:1px solid rgba(46,53,56,0.6);">' +
          '<span class="typing-dot w-1.5 h-1.5 rounded-full" style="background:#a7b3b6;"></span>' +
          '<span class="typing-dot w-1.5 h-1.5 rounded-full" style="background:#a7b3b6; animation-delay:0.15s"></span>' +
          '<span class="typing-dot w-1.5 h-1.5 rounded-full" style="background:#a7b3b6; animation-delay:0.3s"></span>' +
        '</div>' +
      '</div>';
    chatLog.appendChild(row);
    activeTypingRow = row;
    requestAnimationFrame(() => { chatLog.scrollTop = chatLog.scrollHeight; });
  }
  function removeTypingIndicator() {
    if (activeTypingRow) {
      activeTypingRow.remove();
      activeTypingRow = null;
    }
  }

  let activeLiveUserRow = null;
  let activeLiveAssistantRow = null;

  function updateLiveUserTranscript(text) {
    if (!chatLog) return;
    if (!text || !text.trim()) return;

    if (!activeLiveUserRow) {
      const row = document.createElement('div');
      row.className = 'chat-row flex items-start gap-2 max-w-[92%] self-end flex-row-reverse ml-auto';
      row.innerHTML =
        '<div class="shrink-0 w-6 h-6 rounded-full backdrop-blur-sm border flex items-center justify-center mt-3" style="background-color:rgba(0,229,255,0.2); border-color:rgba(0,229,255,0.4);">' +
          SVG_PERSON_SM +
        '</div>' +
        '<div class="flex flex-col gap-1 min-w-0 items-end">' +
          '<span class="flex items-center gap-1.5 text-[10px] px-1" style="color:rgba(167,179,182,0.7);">' +
            'You <span style="opacity:0.5">·</span> ' + timeNow() +
          '</span>' +
          '<div class="chat-bubble live-user-text px-3 py-2 text-[13px] leading-snug rounded-xl backdrop-blur-sm" style="background-color:rgba(0,229,255,0.15); border:1px solid rgba(0,229,255,0.35); border-top-right-radius:2px; color:#e6e8eb; word-break:break-word;"></div>' +
        '</div>';

      if (activeTypingRow && activeTypingRow.parentNode === chatLog) {
        chatLog.insertBefore(row, activeTypingRow);
      } else {
        chatLog.appendChild(row);
      }
      activeLiveUserRow = row;
    }

    const textEl = activeLiveUserRow.querySelector('.live-user-text');
    if (textEl) {
      textEl.textContent = text;
    }
    requestAnimationFrame(() => {
      chatLog.scrollTop = chatLog.scrollHeight;
    });
  }

  function updateLiveAssistantResponse(text) {
    if (!chatLog) return;
    if (!text || !text.trim()) return;
    removeTypingIndicator();

    if (!activeLiveAssistantRow) {
      const row = document.createElement('div');
      row.className = 'chat-row flex items-start gap-2 max-w-[92%] self-start';
      row.innerHTML =
        '<div class="shrink-0 w-6 h-6 rounded-full backdrop-blur-sm border flex items-center justify-center mt-3" style="background:#202427; border-color:rgba(0,229,255,0.25);">' +
          SVG_BLUR_SM +
        '</div>' +
        '<div class="flex flex-col gap-1 min-w-0 items-start">' +
          '<span class="flex items-center gap-1.5 text-[10px] px-1" style="color:rgba(167,179,182,0.7);">' +
            'Jarvis <span style="opacity:0.5">·</span> ' + timeNow() +
          '</span>' +
          '<div class="chat-bubble live-assistant-text px-3 py-2 text-[13px] leading-snug rounded-xl backdrop-blur-sm" style="background:rgba(32,36,39,0.7); border:1px solid rgba(46,53,56,0.6); border-top-left-radius:2px; color:#e6e8eb; word-break:break-word;"></div>' +
        '</div>';

      chatLog.appendChild(row);
      activeLiveAssistantRow = row;
    }

    const textEl = activeLiveAssistantRow.querySelector('.live-assistant-text');
    if (textEl) {
      textEl.textContent = text;
    }
    requestAnimationFrame(() => {
      chatLog.scrollTop = chatLog.scrollHeight;
    });
  }

  function finalizeLiveTurn() {
    activeLiveUserRow = null;
    activeLiveAssistantRow = null;
    removeTypingIndicator();
  }

  function syncChatTurns(turnsJson) {
    if (!chatLog) return;
    try {
      const turns = typeof turnsJson === 'string' ? JSON.parse(turnsJson) : turnsJson;
      if (!Array.isArray(turns)) return;
      activeLiveUserRow = null;
      activeLiveAssistantRow = null;
      chatLog.innerHTML = '';
      if (turns.length === 0) {
        addMessage('jarvis', 'Systems operational. Ready for your command, sir.', timeNow());
        return;
      }
      turns.forEach(t => {
        if (t.userTranscript && t.userTranscript !== '(Audio query)') {
          addMessage('user', t.userTranscript, t.formattedTime || '');
        }
        if (t.jarvisResponse && t.jarvisResponse !== '(Audio response)') {
          addMessage('jarvis', t.jarvisResponse, t.formattedTime || '');
        }
      });
    } catch (e) {
      console.error('Error parsing chat turns', e);
    }
  }

  // ---- Expose APIs for Android native calls ----
  window.setOrbState = function(stateName, level) {
    setState(stateName);
    if (typeof level === 'number') {
      window.setAudioLevel(level);
    }
    if (stateName === 'thinking') {
      showTypingIndicator();
    } else {
      removeTypingIndicator();
    }
  };

  window.setAudioLevel = function(level) {
    const l = Math.max(0, Math.min(1, level));
    setOrbGlow(l, hud.dataset.state || 'listening');
    if (orbCore && (hud.dataset.state === 'listening' || hud.dataset.state === 'speaking')) {
      orbCore.style.transform = `scale(${1 + l * 0.18})`;
    }
  };

  window.setAudioFrequency = function(amp, pitchHz, bass, mid, high) {
    const a = Math.max(0, Math.min(1, amp));
    const b = Math.max(0, Math.min(1, bass));
    const m = Math.max(0, Math.min(1, mid));
    const h = Math.max(0, Math.min(1, high));

    const currentState = hud.dataset.state || 'listening';
    if (currentState === 'listening' || currentState === 'speaking') {
      // 1. Orb core moves & breathes dynamically with voice frequency & pitch
      if (orbCore) {
        const pitchFactor = pitchHz > 0 ? Math.min(1.4, Math.max(0.7, pitchHz / 220)) : 1.0;
        const targetScale = 1.0 + (a * 0.22) + (b * 0.12 * pitchFactor);
        orbCore.style.transform = `scale(${targetScale.toFixed(3)})`;
      }

      // 2. Glow responsive to sound energy
      setOrbGlow(Math.max(a, b * 0.9), currentState);

      // 3. Arc Reactor Coils dance radially in 3 frequency bands
      if (arcCoils && arcCoils.length > 0) {
        arcCoils.forEach((rect, idx) => {
          const bandVal = (idx % 3 === 0) ? b : ((idx % 3 === 1) ? m : h);
          const coilScale = 1.0 + (bandVal * 0.7) + (a * 0.35);
          rect.style.transform = `scale(${coilScale.toFixed(2)})`;
          rect.style.transformOrigin = '128px 128px';
          rect.style.opacity = (0.35 + bandVal * 0.65).toFixed(2);
        });
      }

      // 4. Arc Reactor Rings pulse stroke and glow with vocal frequency
      if (arcRingOuter) {
        arcRingOuter.style.strokeWidth = (1 + h * 3.5).toFixed(1);
        arcRingOuter.style.opacity = (0.35 + a * 0.6).toFixed(2);
      }
      if (arcRingMid) {
        arcRingMid.style.strokeWidth = (1.5 + m * 3.0).toFixed(1);
        arcRingMid.style.opacity = (0.45 + a * 0.55).toFixed(2);
      }
      if (arcGlow) {
        arcGlow.style.opacity = (0.15 + a * 0.7 + b * 0.3).toFixed(2);
        arcGlow.style.transform = `scale(${1.0 + a * 0.25})`;
      }
    }
  };

  window.setLiveTime = function(timeStr) {
    if (hudClock && timeStr) hudClock.textContent = timeStr;
  };

  window.setConnectionStatus = function(status) {
    const s = (status || '').toUpperCase();
    const bars = document.querySelectorAll('.uplink-bar');
    if (s === 'LIVE') {
      bars.forEach(b => { b.style.opacity = '1'; b.style.background = '#00e5ff'; });
      if (statusText && hud.dataset.state === 'idle') setStatusText('Live uplink connected');
    } else if (s === 'STANDBY') {
      bars.forEach((b, i) => { b.style.opacity = (i < 2) ? '1' : '0.3'; b.style.background = '#74d1ff'; });
      if (statusText && hud.dataset.state === 'idle') setStatusText('Standby — listening for wake word');
    } else {
      bars.forEach(b => { b.style.opacity = '0.35'; b.style.background = '#5c6a6d'; });
      if (statusText && hud.dataset.state === 'idle') setStatusText('Offline / Standby');
    }
  };

  window.setPowerState = function(isOn) {
    if (!powerBtn || !powerIcon || !powerText) return;
    if (isOn) {
      powerIcon.style.color = '#00e5ff';
      powerText.textContent = "Online";
      powerText.style.color = '#c3f5ff';
      powerBtn.style.borderColor = 'rgba(0,229,255,0.4)';
    } else {
      powerIcon.style.color = '#ffb4ab';
      powerText.textContent = "Sleep";
      powerText.style.color = '#ffb4ab';
      powerBtn.style.borderColor = 'rgba(255,180,171,0.3)';
    }
  };

  window.setMicMuted = function(isMuted) {
    if (!micIcon) return;
    if (isMuted) {
      micIcon.innerHTML = SVG_MIC_OFF;
      micIcon.style.color = '#ffb4ab';
    } else {
      micIcon.innerHTML = SVG_MIC_ON;
      micIcon.style.color = (hud.dataset.state === 'listening') ? '#ffb4ab' : '#00363d';
    }
  };

  window.setScreenShareState = function(isSharing) {
    const text = document.getElementById('screen-share-text');
    const icon = document.getElementById('screen-share-icon');
    const btn = document.getElementById('screen-share-btn');
    if (text) text.textContent = isSharing ? 'Vision On' : 'Vision';
    if (text) text.style.color = isSharing ? '#00e5ff' : '#74d1ff';
    if (icon) icon.style.color = isSharing ? '#00e5ff' : '#74d1ff';
    if (btn) btn.style.borderColor = isSharing ? '#00e5ff' : 'rgba(0,229,255,0.2)';
    if (btn) btn.style.boxShadow = isSharing ? '0 0 12px rgba(0,229,255,0.6)' : '';
  };

  window.addChatMessage = function(who, text, timeStr) {
    removeTypingIndicator();
    addMessage(who, text, timeStr);
  };

  window.updateLiveUserTranscript = updateLiveUserTranscript;
  window.updateLiveAssistantResponse = updateLiveAssistantResponse;
  window.finalizeLiveTurn = finalizeLiveTurn;
  window.syncChatTurns = syncChatTurns;

  // ---- Interactive Click Triggers (Android vs Standalone Browser) ----
  function pulseOrb() {
    if (orbCore) {
      orbCore.style.transform = 'scale(1.08)';
      setTimeout(() => { orbCore.style.transform = ''; }, 200);
    }
  }

  if (orbCore) {
    orbCore.addEventListener('click', () => {
      pulseOrb();
      if (window.JarvisBridge && window.JarvisBridge.onOrbClicked) {
        window.JarvisBridge.onOrbClicked();
      } else {
        mockBrowserTrigger();
      }
    });
  }

  if (micBtn) {
    micBtn.addEventListener('click', () => {
      pulseOrb();
      if (window.JarvisBridge && window.JarvisBridge.onMicClicked) {
        window.JarvisBridge.onMicClicked();
      } else {
        mockBrowserTrigger();
      }
    });
  }

  if (powerBtn) {
    powerBtn.addEventListener('click', () => {
      if (window.JarvisBridge && window.JarvisBridge.onPowerClicked) {
        window.JarvisBridge.onPowerClicked();
      } else {
        // Toggle locally in browser mode
        const isOnline = powerText.textContent.trim().toLowerCase() === 'online';
        window.setPowerState(!isOnline);
      }
    });
  }

  if (screenShareBtn) {
    screenShareBtn.addEventListener('click', () => {
      if (window.JarvisBridge && window.JarvisBridge.onScreenShareClicked) {
        window.JarvisBridge.onScreenShareClicked();
      }
    });
  }

  if (settingsBtn) {
    settingsBtn.addEventListener('click', () => {
      if (window.JarvisBridge && window.JarvisBridge.onSettingsClicked) {
        window.JarvisBridge.onSettingsClicked();
      } else {
        alert('Diagnostics & Settings');
      }
    });
  }

  if (historyBtn) {
    historyBtn.addEventListener('click', () => {
      if (window.JarvisBridge && window.JarvisBridge.onHistoryClicked) {
        window.JarvisBridge.onHistoryClicked();
      } else {
        alert('Chat History');
      }
    });
  }

  const coreMarkBtn = document.getElementById('core-mark-btn');
  if (coreMarkBtn) {
    coreMarkBtn.addEventListener('click', () => {
      if (window.JarvisBridge && window.JarvisBridge.onHistoryClicked) {
        window.JarvisBridge.onHistoryClicked();
      }
    });
  }

  // ---- Mock Browser Mode for Testing in Chrome/Browser ----
  function mockBrowserTrigger() {
    if (hud.dataset.state === 'idle') {
      setState('listening');
      setOrbGlow(0.6, 'listening');
      let dummyLevel = 0;
      const interval = setInterval(() => {
        dummyLevel = Math.random() * 0.8;
        window.setAudioLevel(dummyLevel);
      }, 100);
      setTimeout(() => {
        clearInterval(interval);
        if (orbCore) orbCore.style.transform = '';
        setState('thinking');
        showTypingIndicator();
        setTimeout(() => {
          removeTypingIndicator();
          setState('speaking');
          addMessage('you', 'Hello Jarvis, give me a status report.');
          addMessage('jarvis', 'All systems online, sir. Power core is stable and telemetry link is secure.');
          setTimeout(() => {
            setState('idle');
          }, 2400);
        }, 1500);
      }, 2500);
    } else {
      setState('idle');
    }
  }

  setState('idle');
})();
</script>
</body>
</html>
